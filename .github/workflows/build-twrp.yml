# Build TWRP recovery for Samsung Galaxy A21 (SC-42A) on GitHub Actions.
#
# Zero-cost path: this repository only holds the device tree. The OmniROM
# sources are fetched inside the runner, so no local disk or paid builder
# is needed. Trigger manually from the Actions tab (workflow_dispatch).

name: TWRP SC-42A

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Set up build space
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential bison flex \
            libncurses5-dev libncursesw5-dev \
            libssl-dev zip wget unzip git \
            python3 python-is-python3 rsync \
            libxml2-utils xsltproc

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -o ~/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Clone OmniROM tree
        run: |
          mkdir -p omni && cd omni
          repo init --depth=1 -u https://github.com/omnirom/android.git -b android-11
          python3 - <<'PY'
          p = ".repo/manifest.xml"
          t = open(p).read()
          t = t.replace('path="frameworks/base" name="android_frameworks_base" remote="omnirom" revision="android-11"',
                        'path="frameworks/base" name="platform/frameworks/base" remote="aosp" revision="refs/tags/android-11.0.0_r38"')
          t = t.replace('path="system/core" name="android_system_core" remote="omnirom" revision="android-11"',
                        'path="system/core" name="platform/system/core" remote="aosp" revision="refs/tags/android-11.0.0_r38"')
          for name in ["android_packages_apps_OmniChange", "android_packages_apps_OmniGears",
                       "android_packages_apps_OmniRemote", "android_packages_apps_OmniStyle",
                       "android_packages_apps_OmniSwitch", "android_packages_apps_OpenDelta",
                       "android_packages_services_OmniJaws"]:
              t = "\n".join(line for line in t.split("\n") if f'name="{name}"' not in line)
          open(p, "w").write(t)
          print("patched stale projects")
          PY
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          repo sync -j"$(nproc)"

      - name: Place device tree
        run: |
          mkdir -p omni/device/samsung/sc42a
          cp -r device_tree/* omni/device/samsung/sc42a/
          ls omni/device/samsung/sc42a/

      - name: Build recovery image
        run: |
          cd omni
          source build/envsetup.sh
          breakfast sc42a
          make recoveryimage -j"$(nproc)"

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: recovery-sc42a
          path: omni/out/target/product/sc42a/recovery.img
