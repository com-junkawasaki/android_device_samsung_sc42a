# Build TWRP recovery for Samsung Galaxy A21 (SC-42A) on GitHub Actions.
#
# Zero-cost path: this repository only holds the device tree. The OmniROM
# sources are fetched inside the runner, so no local disk or paid builder
# is needed. Trigger manually from the Actions tab (workflow_dispatch).

name: TWRP SC-42A

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Set up build space
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential bison flex \
            libncurses5-dev libncursesw5-dev \
            libssl-dev zip wget unzip git \
            python3 python-is-python3 rsync \
            libxml2-utils xsltproc

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -o ~/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Clone OmniROM tree
        run: |
          mkdir -p omni && cd omni
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-10.0-deprecated
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          repo sync -j"$(nproc)"

      - name: Place device tree
        run: |
          mkdir -p omni/device/samsung/sc42a
          cp -r device_tree/* omni/device/samsung/sc42a/
          ls omni/device/samsung/sc42a/

      - name: Stub removed Omni resources
        run: |
          mkdir -p omni/packages/apps/OmniGears/res/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources/>\n' > omni/packages/apps/OmniGears/res/values/strings.xml
          python3 - <<'PY'
          import re
          p = "omni/packages/apps/PermissionController/Android.bp"
          t = open(p).read()
          print("BEFORE sdk lines:", [l for l in t.split("\n") if "sdk_version" in l][:4])
          t = re.sub(r'sdk_version\s*:\s*"system_current",?', 'sdk_version: "system_current",', t)
          t = re.sub(r'(android_app \{\n    name: "PermissionController",)',
                     r'\1\n    sdk_version: "system_current",\n    min_sdk_version: "30",', t, count=1)
          t = t.replace('    platform_apis: true,', '    platform_apis: false,', 1)
          open(p, "w").write(t)
          t2 = open(p).read()
          print("AFTER sdk lines:", [l for l in t2.split("\n") if "sdk_version" in l or "min_sdk" in l][:6])
          print("patched PermissionController")
          PY

      - name: Build recovery image
        run: |
          cd omni
          source build/envsetup.sh
          lunch omni_sc42a-eng
          make recoveryimage -j"$(nproc)"

      - name: Locate recovery image
        run: |
          find omni/out -name "*.img" | head -n 30
          find omni/out/target/product/sc42a -maxdepth 1 | head -n 30

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: recovery-sc42a
          path: |
            omni/out/**/recovery.img
            omni/out/**/boot.img
          if-no-files-found: error
